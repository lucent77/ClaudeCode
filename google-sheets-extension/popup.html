<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets 데이터 입력기</title>
  <style>
    /* ===== 기본 스타일 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    /* ===== 컨테이너 ===== */
    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    /* ===== 헤더 ===== */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      color: #333;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      color: #666;
    }

    /* ===== 상태 표시 ===== */
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #cce5ff;
      color: #004085;
      border: 1px solid #b8daff;
    }

    .status.hidden {
      display: none;
    }

    /* ===== 입력 폼 ===== */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group small {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #888;
    }

    /* ===== 버튼 ===== */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    /* ===== 로그인 섹션 ===== */
    .login-section {
      text-align: center;
      padding: 20px 0;
    }

    .login-section p {
      margin-bottom: 15px;
      color: #666;
      font-size: 13px;
    }

    /* ===== 로그 표시 ===== */
    .log-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .log-section h3 {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .log-content {
      background: #f8f9fa;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      color: #666;
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
    }

    /* ===== 로딩 애니메이션 ===== */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1>Google Sheets 데이터 입력기</h1>
      <p>간편하게 스프레드시트에 데이터를 추가하세요</p>
    </div>

    <!-- 상태 메시지 -->
    <div id="status" class="status hidden"></div>

    <!-- 로그인 섹션 (로그인 전) -->
    <div id="loginSection" class="login-section">
      <p>Google 계정으로 로그인하여<br>시작하세요</p>
      <button id="loginBtn" class="btn btn-primary">
        Google 계정으로 로그인
      </button>
    </div>

    <!-- 메인 폼 (로그인 후) -->
    <div id="mainForm" style="display: none;">
      <!-- 스프레드시트 ID 입력 -->
      <div class="form-group">
        <label for="spreadsheetId">스프레드시트 ID</label>
        <input
          type="text"
          id="spreadsheetId"
          placeholder="예: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms"
        >
        <small>Google Sheets URL에서 /d/ 뒤의 긴 문자열입니다</small>
      </div>

      <!-- 시트 이름 입력 -->
      <div class="form-group">
        <label for="sheetName">시트 이름</label>
        <input
          type="text"
          id="sheetName"
          placeholder="예: Sheet1"
          value="Sheet1"
        >
        <small>데이터를 입력할 시트 탭 이름</small>
      </div>

      <!-- 데이터 입력 -->
      <div class="form-group">
        <label for="dataInput">입력할 데이터</label>
        <textarea
          id="dataInput"
          placeholder="예: 홍길동, 25, 서울&#10;김철수, 30, 부산&#10;(각 줄이 한 행, 쉼표로 열 구분)"
        ></textarea>
        <small>각 줄이 한 행이 되고, 쉼표(,)로 열을 구분합니다</small>
      </div>

      <!-- 버튼들 -->
      <button id="appendBtn" class="btn btn-primary">
        데이터 추가하기
      </button>

      <button id="readBtn" class="btn btn-secondary">
        현재 데이터 읽기
      </button>

      <button id="logoutBtn" class="btn btn-secondary">
        로그아웃
      </button>

      <!-- 로그 섹션 -->
      <div class="log-section">
        <h3>실행 로그</h3>
        <div id="logContent" class="log-content">
          준비 완료...
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript 파일 로드 -->
  <script src="popup.js"></script>
</body>
</html>
