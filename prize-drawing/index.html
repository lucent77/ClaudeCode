<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prize Drawing - Spin to Win!</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Additional inline styles for vertical TV optimization */
        @media (min-height: 1200px) {
            .header h1 { font-size: 4rem; }
            .header .subtitle { font-size: 2rem; }
            .stat-value { font-size: 3.5rem; }
            .stat-label { font-size: 1.3rem; }
            .roulette-container {
                width: min(80vw, 700px);
                height: min(80vw, 700px);
            }
            .spin-button {
                padding: 2rem 6rem;
                font-size: 2.5rem;
            }
            .prize-list-section h2 { font-size: 2.2rem; }
            .prize-item { padding: 1.2rem; }
            .prize-icon { font-size: 2.5rem; }
            .prize-name { font-size: 1.2rem; }
            .prize-stock { font-size: 1rem; }
            .milestone-section h3 { font-size: 1.8rem; }
            .milestone-icon { font-size: 2rem; }
            .milestone-name { font-size: 1.3rem; }
            .milestone-spin { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <!-- Landscape Warning -->
    <div class="landscape-warning">
        <div>
            <h2>Please Rotate Your Screen</h2>
            <p>This application is optimized for portrait (vertical) display</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header -->
        <header class="header">
            <h1>SPIN TO WIN</h1>
            <p class="subtitle">Try Your Luck!</p>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="total-spins">0</div>
                <div class="stat-label">Total Spins</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="next-milestone">-</div>
                <div class="stat-label">Next Milestone</div>
            </div>
        </div>

        <!-- Roulette Section -->
        <section class="roulette-section">
            <div class="roulette-container">
                <div class="roulette-pointer"></div>
                <div id="roulette-wheel">
                    <!-- SVG wheel will be rendered here -->
                </div>
            </div>

            <button id="spin-button" class="spin-button">SPIN</button>
        </section>

        <!-- Prize List -->
        <section class="prize-list-section">
            <h2>Available Prizes</h2>
            <div class="prize-list" id="prize-list">
                <!-- Prize items will be rendered here -->
            </div>
        </section>

        <!-- Milestone Section -->
        <section class="milestone-section">
            <h3>Special Milestone Prizes</h3>
            <div class="milestone-list" id="milestone-list">
                <!-- Milestones will be rendered here -->
            </div>
        </section>

        <!-- Admin Link (small, bottom corner) -->
        <a href="admin.html" style="position: fixed; bottom: 10px; right: 10px; color: rgba(255,255,255,0.3); font-size: 12px; text-decoration: none;">Admin</a>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-icon" id="result-icon">🎁</div>
            <h2 class="modal-title" id="result-title">Congratulations!</h2>
            <p class="modal-prize" id="result-prize">You won a prize!</p>
            <button class="modal-close" id="close-modal">CONTINUE</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
