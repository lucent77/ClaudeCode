# OpenLiteSpeed Reverse Proxy Configuration for Realtime Chat
#
# CyberPanel에서 설정하는 방법:
#
# 1. CyberPanel 관리자 패널에 로그인
# 2. Websites > List Websites로 이동
# 3. 해당 도메인의 "Manage" 클릭
# 4. "Rewrite Rules" 또는 "vHost Conf" 섹션으로 이동
# 5. 아래 설정을 추가
#
# 또는 OpenLiteSpeed WebAdmin Console에서:
# 1. Virtual Hosts > [your vhost] > Context 탭
# 2. Add > Proxy 선택

# =========================================
# Context 설정 (OpenLiteSpeed WebAdmin)
# =========================================
#
# Context Type: Proxy
# URI: /
# Web Server: [New Web Server]
#   Name: ChatAppServer
#   Address: 127.0.0.1:3000
#
# Socket.io용 WebSocket 설정:
# Context Type: Proxy
# URI: /socket.io/
# Web Server: ChatAppServer
# Additional Headers:
#   Upgrade $http_upgrade
#   Connection "upgrade"

# =========================================
# vHost 설정 파일 예시
# 경로: /usr/local/lsws/conf/vhosts/[domain]/vhconf.conf
# =========================================

extprocessor ChatAppServer {
  type                    proxy
  address                 127.0.0.1:3000
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 ChatAppServer
  addDefaultCharset       off
}

# WebSocket support for Socket.io
context /socket.io/ {
  type                    proxy
  handler                 ChatAppServer
  addDefaultCharset       off
  extraHeaders            <<<END_extraHeaders
Upgrade $http_upgrade
Connection "upgrade"
  END_extraHeaders
}

# =========================================
# Rewrite Rules (CyberPanel > Rewrite Rules)
# =========================================
#
# RewriteEngine On
# RewriteCond %{REQUEST_URI}  ^/socket.io/           [NC]
# RewriteCond %{HTTP:Upgrade} websocket               [NC]
# RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]
#
# RewriteRule ^(.*)$ http://127.0.0.1:3000$1 [P]
