<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Realtime Chat - Slack-like team communication">
  <title>Realtime Chat</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="h-screen overflow-hidden">
  <!-- App Container -->
  <div id="app" class="h-full">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-dark-bg flex items-center justify-center z-50">
      <div class="text-center">
        <div class="spinner mx-auto mb-4"></div>
        <p class="text-dark-text-muted">로딩 중...</p>
      </div>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="hidden fixed inset-0 bg-gradient-to-br from-slack-purple-dark to-slack-purple flex items-center justify-center">
      <div class="w-full max-w-md mx-4">
        <div class="text-center mb-8">
          <h1 class="text-4xl font-bold text-white mb-2">Realtime Chat</h1>
          <p class="text-gray-300">팀과 실시간으로 소통하세요</p>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="bg-white rounded-xl p-8 shadow-2xl">
          <h2 class="text-2xl font-bold text-gray-900 mb-6">로그인</h2>

          <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">사용자명 또는 이메일</label>
              <input type="text" id="login-username" required
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slack-purple focus:border-transparent outline-none transition"
                     placeholder="username">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
              <input type="password" id="login-password" required
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slack-purple focus:border-transparent outline-none transition"
                     placeholder="••••••••">
            </div>

            <div id="login-error" class="text-red-500 text-sm hidden"></div>

            <button type="submit" id="login-btn"
                    class="w-full bg-slack-purple text-white py-3 rounded-lg font-semibold hover:bg-slack-purple-light transition">
              로그인
            </button>
          </form>

          <div class="mt-6 text-center">
            <p class="text-gray-600">
              계정이 없으신가요?
              <button onclick="showRegister()" class="text-slack-purple font-semibold hover:underline">회원가입</button>
            </p>
          </div>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="bg-white rounded-xl p-8 shadow-2xl hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-6">회원가입</h2>

          <form onsubmit="handleRegister(event)" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">사용자명</label>
              <input type="text" id="register-username" required
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slack-purple focus:border-transparent outline-none transition"
                     placeholder="username (영문, 숫자, 밑줄)"
                     pattern="[a-zA-Z0-9_]{3,20}">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">이메일</label>
              <input type="email" id="register-email" required
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slack-purple focus:border-transparent outline-none transition"
                     placeholder="you@example.com">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">표시 이름</label>
              <input type="text" id="register-displayname"
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slack-purple focus:border-transparent outline-none transition"
                     placeholder="홍길동">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
              <input type="password" id="register-password" required minlength="6"
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slack-purple focus:border-transparent outline-none transition"
                     placeholder="최소 6자">
            </div>

            <div id="register-error" class="text-red-500 text-sm hidden"></div>

            <button type="submit" id="register-btn"
                    class="w-full bg-slack-purple text-white py-3 rounded-lg font-semibold hover:bg-slack-purple-light transition">
              가입하기
            </button>
          </form>

          <div class="mt-6 text-center">
            <p class="text-gray-600">
              이미 계정이 있으신가요?
              <button onclick="showLogin()" class="text-slack-purple font-semibold hover:underline">로그인</button>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chat-screen" class="hidden h-full flex">
      <!-- Workspace Sidebar -->
      <div class="w-16 bg-slack-purple-dark flex flex-col items-center py-4 space-y-4">
        <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-slack-purple font-bold text-xl cursor-pointer hover:rounded-2xl transition-all">
          R
        </div>
        <div class="w-8 h-0.5 bg-white/30 rounded"></div>
      </div>

      <!-- Channel Sidebar -->
      <div id="sidebar" class="w-64 sidebar flex flex-col">
        <!-- Workspace Header -->
        <div class="px-4 py-3 flex items-center justify-between border-b border-white/10">
          <div>
            <h2 class="text-white font-bold text-lg">Realtime Chat</h2>
            <div class="flex items-center gap-1.5">
              <span class="status-online"></span>
              <span id="current-user-name" class="text-sm text-gray-300"></span>
            </div>
          </div>
          <button onclick="showProfileMenu()" class="text-white/70 hover:text-white p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
        </div>

        <!-- Search -->
        <div class="px-3 py-3">
          <div class="search-container">
            <svg class="search-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="search-input" placeholder="검색" class="search-input" onkeyup="handleSearch(event)">
          </div>
        </div>

        <!-- Channels Section -->
        <div class="flex-1 overflow-y-auto">
          <div class="sidebar-section-title" onclick="toggleSection('channels')">
            <div class="flex items-center gap-1">
              <svg id="channels-arrow" class="w-3 h-3 transition-transform" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
              </svg>
              <span>채널</span>
            </div>
            <button onclick="event.stopPropagation(); showCreateChannel()" class="hover:bg-white/10 rounded p-0.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
            </button>
          </div>
          <div id="channels-list" class="pb-2">
            <!-- Channels will be populated here -->
          </div>

          <!-- Direct Messages Section -->
          <div class="sidebar-section-title" onclick="toggleSection('dms')">
            <div class="flex items-center gap-1">
              <svg id="dms-arrow" class="w-3 h-3 transition-transform" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
              </svg>
              <span>다이렉트 메시지</span>
            </div>
            <button onclick="event.stopPropagation(); showUserList()" class="hover:bg-white/10 rounded p-0.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
            </button>
          </div>
          <div id="dm-list" class="pb-2">
            <!-- DM conversations will be populated here -->
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div class="flex-1 flex flex-col bg-dark-bg">
        <!-- Channel Header -->
        <div id="chat-header" class="h-14 px-5 flex items-center justify-between border-b border-dark-border">
          <div class="flex items-center gap-2">
            <span id="chat-icon" class="text-dark-text-muted">#</span>
            <h3 id="chat-title" class="font-bold text-white">general</h3>
            <span id="chat-description" class="text-sm text-dark-text-muted ml-2 border-l border-dark-border pl-2"></span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="showMembersList()" class="toolbar-btn flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
              <span id="members-count" class="text-sm">0</span>
            </button>
          </div>
        </div>

        <!-- Messages Container -->
        <div id="messages-container" class="flex-1 overflow-y-auto">
          <div id="messages-list" class="py-4">
            <!-- Messages will be populated here -->
          </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator hidden">
          <span class="typing-dot" style="animation-delay: 0s"></span>
          <span class="typing-dot" style="animation-delay: 0.2s"></span>
          <span class="typing-dot" style="animation-delay: 0.4s"></span>
          <span id="typing-users" class="ml-2"></span>
        </div>

        <!-- Message Input -->
        <div class="px-5 pb-5">
          <div class="chat-input-container">
            <textarea id="message-input"
                      class="chat-input"
                      rows="1"
                      placeholder="메시지를 입력하세요..."
                      onkeydown="handleMessageKeydown(event)"
                      oninput="handleTyping()"></textarea>
            <div class="chat-input-toolbar">
              <div class="flex items-center gap-1">
                <button class="toolbar-btn" onclick="insertEmoji()">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                </button>
                <button class="toolbar-btn" onclick="attachFile()">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                  </svg>
                </button>
              </div>
              <button id="send-btn" class="send-btn" onclick="sendMessage()" disabled>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Members Sidebar (toggleable) -->
      <div id="members-sidebar" class="hidden w-64 bg-dark-bg border-l border-dark-border overflow-y-auto">
        <div class="p-4 border-b border-dark-border">
          <h3 class="font-bold text-white">멤버</h3>
        </div>
        <div id="members-list" class="p-2">
          <!-- Members will be populated here -->
        </div>
      </div>
    </div>

    <!-- Modals Container -->
    <div id="modals"></div>
  </div>

  <!-- JavaScript -->
  <script src="/js/app.js"></script>
</body>
</html>
